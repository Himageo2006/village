<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Village</title>
<style>
  /* The canvas keeps a tall shape, so a tablet or a desktop window gets bars at
     the sides. Near-black beside a bright turquoise sea read as a broken layout;
     a deeper tone of the same sea reads as the frame around it. */
  html,body{margin:0;height:100%;overflow:hidden;
    background:#0a3940 radial-gradient(ellipse at center,#12606a 0%,#0b4249 55%,#062529 100%) fixed;
    font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{max-width:100%;max-height:100%;
    image-rendering:auto;
    /* taps fire on pointerUP so a drag can be told apart from a tap; without this
       the WebView claims the gesture as a scroll and tapping stops working */
    touch-action:none; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<!-- The only way to read env(safe-area-inset-*) is to let CSS resolve it onto
     something and ask for the computed value. This element exists for that. -->
<div id="safe" style="position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;
  pointer-events:none;padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)"></div>
<div id="wrap"><canvas id="c" width="1024" height="1536"></canvas></div>
<script src="game.js"></script>
</body>
</html>
