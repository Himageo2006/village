<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Village</title>
<style>
  html,body{margin:0;height:100%;background:#0e1410;overflow:hidden;
    font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{max-width:100%;max-height:100%;
    image-rendering:auto;
    /* taps fire on pointerUP so a drag can be told apart from a tap; without this
       the WebView claims the gesture as a scroll and tapping stops working */
    touch-action:none; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1024" height="1536"></canvas></div>
<script src="game.js"></script>
</body>
</html>
